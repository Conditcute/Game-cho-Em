<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff3f6">
  <title>Anh có câu hỏi cho em</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #713e56;
      background: #fff3f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 24px);
      text-align: center;
    }

    main {
      width: min(100%, 700px);
    }

    h1 {
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      line-height: 1.2;
    }

    button {
      border: 0;
      border-radius: 999px;
      min-height: 48px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px #713e5626;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid #713e56;
      outline-offset: 3px;
    }

    #startButton,
    #correctButton {
      color: #426b53;
      background: #d7f3e3;
    }

    #game[hidden],
    #startScreen[hidden] {
      display: none;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: min(55vh, 380px);
      height: min(55svh, 380px);
      min-height: 280px;
      margin: 22px auto;
      overflow: hidden;
      border: 3px solid #ffd1dc;
      border-radius: 22px;
      background: #fff;
    }

    #movingButton {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #713e56;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      white-space: nowrap;
    }

    #correctButton {
      position: absolute;
      bottom: 14px;
      left: 50%;
      max-width: calc(100% - 24px);
      transform: translateX(-50%);
      white-space: normal;
    }

    dialog {
      width: min(90vw, 460px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: clamp(18px, 5vw, 26px);
      border: 0;
      border-radius: 22px;
      color: #713e56;
      text-align: center;
      box-shadow: 0 16px 50px #44233355;
    }

    dialog::backdrop {
      background: #2f1e28a8;
    }

    #imageCaption {
      margin: 0;
      font-size: 0.9rem;
    }

    #resultImage {
      display: block;
      max-width: 100%;
      max-height: 45vh;
      max-height: 45dvh;
      margin: 18px auto;
      border-radius: 16px;
      object-fit: contain;
    }

    #imageFallback {
      margin: 18px 0;
      padding: 18px;
      border: 2px dashed #e8a9b8;
      border-radius: 16px;
      background: #fff3f6;
    }

    #closeDialog {
      color: #fff;
      background: #b94d70;
    }

    @media (max-width: 480px) {
      #gameArea {
        min-height: 300px;
      }

      dialog {
        width: calc(100vw - 24px);
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="startScreen">
      <h1>Anh có câu hỏi cho em</h1>
      <button id="startButton" type="button">OK</button>
    </section>

    <section id="game" hidden>
      <h1>EM YÊU CÓ THẤY ANH ĐẸP TRAI HONG NÒ?</h1>
      <p>EM YÊU CHỌN CÂU TRẢ LỜI NHÓ</p>
      <div id="gameArea">
        <button id="movingButton" type="button">ĐÉO</button>
        <button id="correctButton" type="button">ANH YÊU RẤT ĐẸP TRAI!!!</button>
      </div>
    </section>
  </main>

  <dialog id="resultDialog" aria-labelledby="resultMessage">
    <h2 id="resultMessage">TÔI BIẾT EM YÊU TÔI VÌ TÔI RẤT ĐẸP TRAI MÀ</h2>
    <p id="imageCaption">Khỏi cãi nha em iu của anh</p>
    <img id="resultImage" src="anh dep trai.jfif" alt="Ảnh đẹp trai">
    <p id="imageFallback" hidden>
      Không tải được ảnh. Hãy kiểm tra tên và vị trí tệp ảnh.
    </p>
    <button id="closeDialog" type="button">Đóng</button>
  </dialog>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const game = document.getElementById("game");
    const gameArea = document.getElementById("gameArea");
    const movingButton = document.getElementById("movingButton");
    const correctButton = document.getElementById("correctButton");
    const resultDialog = document.getElementById("resultDialog");
    const resultImage = document.getElementById("resultImage");
    const imageFallback = document.getElementById("imageFallback");
    const closeDialog = document.getElementById("closeDialog");

    function moveWrongAnswer() {
      const maxX = Math.max(0, gameArea.clientWidth - movingButton.offsetWidth);
      const maxY = Math.max(
        0,
        gameArea.clientHeight -
          movingButton.offsetHeight -
          correctButton.offsetHeight -
          36
      );

      movingButton.style.left = Math.random() * maxX + "px";
      movingButton.style.top = Math.random() * maxY + "px";
    }

    startButton.addEventListener("click", function () {
      startScreen.hidden = true;
      game.hidden = false;
      moveWrongAnswer();
    });

    movingButton.addEventListener("click", moveWrongAnswer);

    correctButton.addEventListener("click", function () {
      resultDialog.showModal();
    });

    resultImage.addEventListener("error", function () {
      resultImage.hidden = true;
      imageFallback.hidden = false;
    });

    resultImage.addEventListener("load", function () {
      resultImage.hidden = false;
      imageFallback.hidden = true;
    });

    closeDialog.addEventListener("click", function () {
      resultDialog.close();
    });
  </script>
</body>
</html>
